server:
  port: 8084
spring:
  application:
    name: bancoxyz-audit-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bancoxyz-audit
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: cl.duoc.bancoxyz.audit.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: cl.duoc.bancoxyz.audit.event.TransactionEvent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bancoxyz_operacional?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:bancoxyz}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
bancoxyz:
  kafka:
    topic-transacciones: bancoxyz.transacciones
