spring.application.name=bancoxyz-batch
spring.main.web-application-type=none
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-business.sql
spring.sql.init.continue-on-error=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bancoxyz_batch}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:bancoxyz}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}

batch.chunk-size=${BATCH_CHUNK_SIZE:50}
batch.partition.grid-size=${BATCH_GRID_SIZE:4}
batch.skip-limit=${BATCH_SKIP_LIMIT:10000}
batch.retry-limit=${BATCH_RETRY_LIMIT:3}
batch.retry-backoff-ms=${BATCH_RETRY_BACKOFF_MS:200}

banco.intereses.ahorro=${INTERES_AHORRO:0.005}
banco.intereses.prestamo=${INTERES_PRESTAMO:0.015}
banco.intereses.hipoteca=${INTERES_HIPOTECA:0.008}

logging.level.root=INFO
logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bancoxyzbatch=INFO
