server:
  port: 8081

backend:
  service-id: bancoxyz-backend-core

resilience4j:
  circuitbreaker:
    instances:
      backendCore:
        ignore-exception-predicate: cl.duoc.bancoxyz.web.client.BackendClient$BusinessFailurePredicate
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 8s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      backendCore:
        timeout-duration: 4s
