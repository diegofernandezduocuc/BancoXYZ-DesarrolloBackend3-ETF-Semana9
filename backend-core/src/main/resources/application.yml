server:
  port: 8080

spring:
  application:
    name: bancoxyz-backend-core
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

bancoxyz:
  kafka:
    topic-transacciones: bancoxyz.transacciones
  oauth:
    client-id: ${OAUTH_CLIENT_ID:bancoxyz-client}
    client-secret: ${OAUTH_CLIENT_SECRET:}
    token-uri: ${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
