services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: bancoxyz/config-server:etf9
    ports:
    - 127.0.0.1:8888:8888
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8888/application/default >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: bancoxyz/discovery-server:etf9
    ports:
    - 127.0.0.1:8761:8761
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8761/eureka/apps >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: bancoxyz/auth-server:etf9
    ports:
    - 127.0.0.1:9000:9000
    environment:
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-bancoxyz-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?Defina OAUTH_CLIENT_SECRET en el archivo .env}
      OAUTH_ISSUER_URI: http://auth-server:9000
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9000/.well-known/oauth-authorization-server >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  backend-core:
    build:
      context: .
      dockerfile: backend-core/Dockerfile
    image: bancoxyz/backend-core:etf9
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      AUTH_TOKEN_URI: http://auth-server:9000/oauth2/token
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-bancoxyz-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?Defina OAUTH_CLIENT_SECRET en el archivo .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    healthcheck:
      test:
      - CMD-SHELL
      - status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/backend/cuentas); [ "$$status" = "401" ] ||
        [ "$$status" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: bancoxyz/bff-web:etf9
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test:
      - CMD-SHELL
      - status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/web/cuentas); [ "$$status" = "401" ] || [ "$$status"
        = "200" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    image: bancoxyz/bff-mobile:etf9
    ports:
    - 127.0.0.1:8082:8082
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test:
      - CMD-SHELL
      - status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/mobile/cuentas); [ "$$status" = "401" ] || [
        "$$status" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    image: bancoxyz/bff-atm:etf9
    ports:
    - 127.0.0.1:8083:8083
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test:
      - CMD-SHELL
      - status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/api/atm/cuentas/106/saldo); [ "$$status" = "401"
        ] || [ "$$status" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    image: bancoxyz/audit-service:etf9
    ports:
    - 127.0.0.1:8084:8084
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: jdbc:mysql://mysql:3306/bancoxyz_operacional?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: bancoxyz
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    healthcheck:
      test:
      - CMD-SHELL
      - status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8084/api/audit/eventos); [ "$$status" = "401" ] || [
        "$$status" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: bancoxyz_operacional
      MYSQL_USER: bancoxyz
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    ports:
    - 127.0.0.1:3307:3306
    volumes:
    - bancoxyz-mysql:/var/lib/mysql
    - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 35s
  cuentas-service:
    build:
      context: .
      dockerfile: cuentas-service/Dockerfile
    image: bancoxyz/cuentas-service:etf9
    ports:
    - 127.0.0.1:8085:8085
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      DB_URL: jdbc:mysql://mysql:3306/bancoxyz_operacional?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: bancoxyz
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    healthcheck:
      test:
      - CMD-SHELL
      - code=$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/api/cuentas ); [ "$$code" = "401" ] || [ "$$code"
        = "403" ] || [ "$$code" = "405" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
  pagos-service:
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    image: bancoxyz/pagos-service:etf9
    ports:
    - 127.0.0.1:8086:8086
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test:
      - CMD-SHELL
      - code=$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/api/pagos/retiros/106 ); [ "$$code" = "401" ] || [
        "$$code" = "403" ] || [ "$$code" = "405" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
  clientes-service:
    build:
      context: .
      dockerfile: clientes-service/Dockerfile
    image: bancoxyz/clientes-service:etf9
    ports:
    - 127.0.0.1:8087:8087
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://auth-server:9000
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      DB_URL: jdbc:mysql://mysql:3306/bancoxyz_operacional?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: bancoxyz
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    healthcheck:
      test:
      - CMD-SHELL
      - code=$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8087/api/clientes ); [ "$$code" = "401" ] || [ "$$code"
        = "403" ] || [ "$$code" = "405" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
  batch-service:
    profiles:
    - batch
    build:
      context: .
      dockerfile: batch-service/Dockerfile
    image: bancoxyz/batch-service:etf9
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: bancoxyz_batch
      DB_USER: bancoxyz
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    depends_on:
      mysql:
        condition: service_healthy
  tls-gateway:
    image: caddy:2.9-alpine
    ports:
    - 8443:443
    volumes:
    - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    - bancoxyz-caddy:/data
    depends_on:
      bff-web:
        condition: service_healthy
      bff-mobile:
        condition: service_healthy
      bff-atm:
        condition: service_healthy
volumes:
  bancoxyz-mysql: {}
  bancoxyz-caddy: {}
