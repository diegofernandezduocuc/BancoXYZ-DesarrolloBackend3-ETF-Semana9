name: Verificacion Maven ETF S9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-unitarias:
    name: Maven - Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7
      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar los modulos
        run: mvn -B -ntp verify
